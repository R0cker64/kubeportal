name: Release

# Publishes a version when a tag vX.Y.Z (or a release candidate vX.Y.Z-rc.N)
# is pushed: the image to
# ghcr.io/r0cker64/kubeportal and the chart to oci://ghcr.io/r0cker64/charts,
# both signed with cosign keyless (GitHub OIDC). The chart pins the image by
# digest. See docs/adr/0010-release-ghcr-cosign.md.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/r0cker64/kubeportal
  CHART_REPO: oci://ghcr.io/r0cker64/charts
  CHART_REF: ghcr.io/r0cker64/charts/kubeportal
  TRIVY_VERSION: v0.75.0
  HELM_VERSION: v4.3.0

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # cosign keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version from tag
        id: version
        run: |
          v="${GITHUB_REF_NAME#v}"
          [[ "${v}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || { echo "invalid tag ${GITHUB_REF_NAME}"; exit 1; }
          echo "version=${v}" >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Scan before anything is published.
      - name: Build for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: kubeportal:release
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
      - name: Scan image
        run: trivy image --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed kubeportal:release

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Package chart pinned to the image digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          values=deploy/helm/kubeportal/values.yaml
          [[ "$(grep -c '^  digest: ""$' "${values}")" == 1 ]] || { echo "image.digest not found in ${values}"; exit 1; }
          sed -i "s|^  digest: \"\"$|  digest: \"${DIGEST}\"|" "${values}"
          helm lint --strict deploy/helm/kubeportal
          helm package deploy/helm/kubeportal --version "${VERSION}" --app-version "${VERSION}" -d dist

      - name: Push chart
        id: chart
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          printf '%s' "${TOKEN}" | helm registry login ghcr.io --username "${ACTOR}" --password-stdin
          helm push "dist/kubeportal-${VERSION}.tgz" "${CHART_REPO}" 2>&1 | tee push.log
          digest="$(grep -oE 'sha256:[a-f0-9]{64}' push.log | tail -1)"
          [[ -n "${digest}" ]] || { echo "chart digest not found"; exit 1; }
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Sign chart
        env:
          DIGEST: ${{ steps.chart.outputs.digest }}
        run: cosign sign --yes "${CHART_REF}@${DIGEST}"

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
        run: |
          {
            echo "## KubePortal ${VERSION}"
            echo
            echo "| Artifact | Reference |"
            echo "|---|---|"
            echo "| Image | \`${IMAGE}@${IMAGE_DIGEST}\` |"
            echo "| Chart | \`${CHART_REPO}/kubeportal:${VERSION}\` (\`${CHART_DIGEST}\`) |"
            echo
            echo '```'
            echo "helm install kubeportal ${CHART_REPO}/kubeportal --version ${VERSION} -n kubeportal --create-namespace -f values.yaml"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
