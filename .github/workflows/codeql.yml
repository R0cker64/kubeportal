name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    permissions:
      # actions: read is required by codeql-action on private repositories.
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Detect repository visibility
        id: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "private=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .private)" >> "${GITHUB_OUTPUT}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.language == 'go'
        with:
          go-version-file: backend/go.mod
          cache: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - uses: github/codeql-action/autobuild@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: matrix.build-mode == 'autobuild'
        with:
          working-directory: backend
      # Private repositories without GitHub Advanced Security cannot upload
      # results to code scanning, so the SARIF is checked here instead. Once
      # the repository is public, results are uploaded to the Security tab.
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
          upload: ${{ steps.repo.outputs.private == 'true' && 'never' || 'always' }}
          output: ${{ runner.temp }}/codeql-results
      - name: Fail on findings (private repository)
        if: steps.repo.outputs.private == 'true'
        env:
          RESULTS_DIR: ${{ runner.temp }}/codeql-results
        run: |
          count=$(jq '[.runs[].results[]] | length' "${RESULTS_DIR}"/*.sarif)
          jq -r '.runs[].results[] | "\(.ruleId): \(.message.text) (\(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine))"' "${RESULTS_DIR}"/*.sarif
          echo "CodeQL findings: ${count}"
          test "${count}" -eq 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.repo.outputs.private == 'true'
        with:
          name: codeql-${{ matrix.language }}-sarif
          path: ${{ runner.temp }}/codeql-results
          if-no-files-found: ignore
          retention-days: 14
