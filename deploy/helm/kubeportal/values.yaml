image:
  repository: ghcr.io/r0cker64/kubeportal
  # Defaults to the chart appVersion.
  tag: ""
  # When set, the image is referenced by digest (recommended).
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Defaults match the kind environment (deploy/kind); override them per cluster.
config:
  # Public URL users open in the browser (with port-forward: http://localhost:8080).
  publicURL: http://localhost:8080
  # Namespaces that represent environments, comma separated.
  environments: dev,staging,prod
  logLevel: info
  # Keycloak group whose members are administrators.
  adminGroup: kubeportal-admin
  oidc:
    # Public issuer, validated against the `iss` claim.
    issuerURL: http://localhost:8180/realms/kubeportal
    # Where the backend fetches metadata and keys (in-cluster Service).
    # Empty means the same as issuerURL.
    discoveryURL: http://keycloak.keycloak.svc:8080/realms/kubeportal
    clientID: kubeportal
  lokiURL: http://loki-gateway.monitoring.svc
  prometheusURL: http://prometheus-server.monitoring.svc
  # Label with the node name on cAdvisor series: "instance" in the
  # prometheus-community chart, "node" in kube-prometheus-stack.
  cadvisorNodeLabel: instance
  sessionTTL: 8h
  sessionIdleTimeout: 1h
  upstreamTimeout: 10s
  # Limits on log queries (docs/security-model.md, T8).
  logMaxRange: 168h
  logMaxLines: 1000
  logMaxSearchLen: 256
  liveTailsPerUser: 3

# Existing Secrets the chart references; it never creates or reads them.
secrets:
  oidcClientSecret: { name: kubeportal-oidc, key: client-secret }
  # PostgreSQL URL, e.g. postgres://user:pass@host:5432/db?sslmode=require
  databaseURL: { name: kubeportal-db, key: url }
  # 32 random bytes as hex (openssl rand -hex 32).
  sessionKey: { name: kubeportal-session, key: key }

service:
  port: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

serviceAccount:
  # The ServiceAccount is read-only (get/list/watch) and has no access to
  # Secrets or ConfigMaps (ADR 0005). Do not widen it without a new ADR.
  name: ""

networkPolicy:
  enabled: true
  # Egress to the Kubernetes API server. Narrow these CIDRs to the real API
  # server endpoints in each cluster.
  apiServer:
    cidrs: ["0.0.0.0/0"]
    ports: [443, 6443]
  # Selectors for the dependencies the backend is allowed to reach.
  egress:
    loki:
      namespace: monitoring
      podLabels: { app.kubernetes.io/name: loki }
      ports: [80, 8080, 3100]
    prometheus:
      namespace: monitoring
      podLabels: { app.kubernetes.io/name: prometheus }
      ports: [80, 9090]
    keycloak:
      namespace: keycloak
      podLabels: { app.kubernetes.io/name: keycloak }
      ports: [8080]
    postgres:
      namespace: ""  # empty = release namespace
      podLabels: { app.kubernetes.io/name: postgres }
      ports: [5432]

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
