apiVersion: v1
kind: Pod
metadata:
  name: {{ include "kubeportal.fullname" . }}-test-health
  # Must not reuse the selector labels: the Service and the NetworkPolicy
  # would otherwise select this pod too.
  labels:
    app.kubernetes.io/name: {{ include "kubeportal.name" . }}-test
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl
      image: curlimages/curl:8.21.0@sha256:7c12af72ceb38b7432ab85e1a265cff6ae58e06f95539d539b654f2cfa64bb13
      args: ["-sf", "--max-time", "10", "http://{{ include "kubeportal.fullname" . }}:{{ .Values.service.port }}/healthz"]
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { cpu: 100m, memory: 64Mi }
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
