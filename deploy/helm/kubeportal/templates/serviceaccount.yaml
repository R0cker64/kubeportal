apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kubeportal.serviceAccountName" . }}
  labels:
    {{- include "kubeportal.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
