# Read-only access (ADR 0005). Secrets and ConfigMaps are deliberately absent.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubeportal.fullname" . }}-read
  labels:
    {{- include "kubeportal.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, events, nodes, namespaces]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubeportal.fullname" . }}-read
  labels:
    {{- include "kubeportal.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubeportal.fullname" . }}-read
subjects:
  - kind: ServiceAccount
    name: {{ include "kubeportal.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
