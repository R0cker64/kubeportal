apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubeportal.fullname" . }}
  labels:
    {{- include "kubeportal.labels" . | nindent 4 }}
spec:
  # Single replica by design (docs/architecture.md, "Escala prevista").
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "kubeportal.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kubeportal.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "kubeportal.serviceAccountName" . }}
      # The backend is the only pod that needs API credentials.
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kubeportal
          image: {{ include "kubeportal.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: KUBEPORTAL_LISTEN_ADDR
              value: ":{{ .Values.service.port }}"
            - name: KUBEPORTAL_PUBLIC_URL
              value: {{ required "config.publicURL is required" .Values.config.publicURL | quote }}
            - name: KUBEPORTAL_ENVIRONMENTS
              value: {{ required "config.environments is required" .Values.config.environments | quote }}
            - name: KUBEPORTAL_LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop: [ALL]
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
