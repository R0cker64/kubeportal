apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubeportal.fullname" . }}
  labels:
    {{- include "kubeportal.labels" . | nindent 4 }}
spec:
  # Single replica by design (docs/architecture.md, "Escala prevista").
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "kubeportal.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kubeportal.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "kubeportal.serviceAccountName" . }}
      # The backend is the only pod that needs API credentials.
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kubeportal
          image: {{ include "kubeportal.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: KUBEPORTAL_LISTEN_ADDR
              value: ":{{ .Values.service.port }}"
            - name: KUBEPORTAL_PUBLIC_URL
              value: {{ required "config.publicURL is required" .Values.config.publicURL | quote }}
            - name: KUBEPORTAL_ENVIRONMENTS
              value: {{ required "config.environments is required" .Values.config.environments | quote }}
            - name: KUBEPORTAL_LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: KUBEPORTAL_ADMIN_GROUP
              value: {{ required "config.adminGroup is required" .Values.config.adminGroup | quote }}
            - name: KUBEPORTAL_OIDC_ISSUER_URL
              value: {{ required "config.oidc.issuerURL is required" .Values.config.oidc.issuerURL | quote }}
            {{- with .Values.config.oidc.discoveryURL }}
            - name: KUBEPORTAL_OIDC_DISCOVERY_URL
              value: {{ . | quote }}
            {{- end }}
            - name: KUBEPORTAL_OIDC_CLIENT_ID
              value: {{ required "config.oidc.clientID is required" .Values.config.oidc.clientID | quote }}
            - name: KUBEPORTAL_LOKI_URL
              value: {{ required "config.lokiURL is required" .Values.config.lokiURL | quote }}
            - name: KUBEPORTAL_PROMETHEUS_URL
              value: {{ required "config.prometheusURL is required" .Values.config.prometheusURL | quote }}
            - name: KUBEPORTAL_CADVISOR_NODE_LABEL
              value: {{ .Values.config.cadvisorNodeLabel | quote }}
            - name: KUBEPORTAL_SESSION_TTL
              value: {{ .Values.config.sessionTTL | quote }}
            - name: KUBEPORTAL_SESSION_IDLE_TIMEOUT
              value: {{ .Values.config.sessionIdleTimeout | quote }}
            - name: KUBEPORTAL_UPSTREAM_TIMEOUT
              value: {{ .Values.config.upstreamTimeout | quote }}
            - name: KUBEPORTAL_LOG_MAX_RANGE
              value: {{ .Values.config.logMaxRange | quote }}
            - name: KUBEPORTAL_LOG_MAX_LINES
              value: {{ .Values.config.logMaxLines | quote }}
            - name: KUBEPORTAL_LOG_MAX_SEARCH_LEN
              value: {{ .Values.config.logMaxSearchLen | quote }}
            - name: KUBEPORTAL_LIVE_TAILS_PER_USER
              value: {{ .Values.config.liveTailsPerUser | quote }}
            - name: KUBEPORTAL_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.oidcClientSecret.name }}
                  key: {{ .Values.secrets.oidcClientSecret.key }}
            - name: KUBEPORTAL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.databaseURL.name }}
                  key: {{ .Values.secrets.databaseURL.key }}
            - name: KUBEPORTAL_SESSION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.sessionKey.name }}
                  key: {{ .Values.secrets.sessionKey.key }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          startupProbe:
            # Informers and migrations may take a while on first start.
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop: [ALL]
          {{- if .Values.database.caSecret.name }}
          volumeMounts:
            - name: db-ca
              mountPath: /etc/kubeportal/db-ca
              readOnly: true
          {{- end }}
      {{- if .Values.database.caSecret.name }}
      volumes:
        - name: db-ca
          secret:
            secretName: {{ .Values.database.caSecret.name }}
            items:
              - key: {{ .Values.database.caSecret.key }}
                path: {{ .Values.database.caSecret.key }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
