# Single-binary Loki for local development (filesystem storage, no auth).
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 168h
    allow_structured_metadata: true
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  pattern_ingester:
    enabled: false
  ruler:
    enable_api: false

singleBinary:
  replicas: 1
  persistence:
    size: 5Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

backend: { replicas: 0 }
read: { replicas: 0 }
write: { replicas: 0 }

gateway:
  enabled: true
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }

chunksCache: { enabled: false }
resultsCache: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
minio: { enabled: false }
