apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-worker
  labels:
    app.kubernetes.io/name: catalog-worker
    team: catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-worker
        team: catalog
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          env:
            - name: APP
              value: catalog-worker
          command: ["/bin/sh", "-c"]
          args:
            - |
              i=0
              limit=$((30 + RANDOM % 60))
              while [ $i -lt $limit ]; do
                i=$((i+1))
                echo "{\"level\":\"info\",\"app\":\"$APP\",\"seq\":$i,\"msg\":\"processing job\"}"
                sleep 2
              done
              echo "{\"level\":\"error\",\"app\":\"$APP\",\"msg\":\"fatal: queue connection lost\"}"
              exit 1
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { cpu: 50m, memory: 32Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
