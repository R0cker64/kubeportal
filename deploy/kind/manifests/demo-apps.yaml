# Demo workloads, applied to the dev, staging and prod namespaces by up.sh.
# legacy-batch has no `team` label on purpose: only the admin may see it.
# search-api belongs to team `search`, which is not seeded: an admin creates
# it from the portal (Phase 3 exit criterion, checked by make dev-e2e).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  labels:
    app.kubernetes.io/name: payments-api
    team: payments
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payments-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payments-api
        team: payments
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          env:
            - name: APP
              value: payments-api
          command: ["/bin/sh", "-c"]
          args:
            - |
              i=0
              while true; do
                i=$((i+1))
                case $((RANDOM % 10)) in
                  0) lvl=error; msg="upstream timeout after 3000ms" ;;
                  1|2) lvl=warn; msg="slow request took 850ms" ;;
                  *) lvl=info; msg="request handled" ;;
                esac
                echo "{\"level\":\"$lvl\",\"app\":\"$APP\",\"seq\":$i,\"msg\":\"$msg\"}"
                sleep 2
              done
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { cpu: 50m, memory: 32Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
